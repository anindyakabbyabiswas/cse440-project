<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSE440 Classifier</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
body{margin:0;padding:20px;font-family:"Instrument Sans",system-ui;background:#e9ecee;color:#17202a;}
.c{max-width:720px;margin:0 auto;}
h1{font-size:28px;margin:0 0 8px;font-weight:600;}
.meta{color:#5d6b78;font-size:13px;margin-bottom:28px;}
label{display:block;font-weight:500;margin:18px 0 8px;}
textarea{width:100%;min-height:140px;padding:12px;font:inherit;border:1px solid #d3d9dd;border-radius:3px;background:#fff;resize:vertical;}
textarea:focus{outline:2px solid #2c6e6a;outline-offset:1px;border-color:#2c6e6a;}
.ctrl{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;align-items:center;}
select,button{font:inherit;font-weight:500;padding:10px 16px;border:1px solid #17202a;border-radius:3px;background:#fff;cursor:pointer;}
button{background:#17202a;color:#fff;}
button:hover:not(:disabled){background:#0c141c;}
button:disabled{opacity:.5;cursor:not-allowed;}
.cnt{color:#5d6b78;font-size:12px;}
#result{margin-top:32px;}
.panel{background:#fff;border:1px solid #d3d9dd;border-radius:3px;padding:24px;}
.circles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:24px;margin:20px 0;}
.circle-wrap{display:flex;flex-direction:column;align-items:center;}
.circle-svg{width:120px;height:120px;}
.circle-bg{fill:none;stroke:#d3d9dd;stroke-width:8;}
.circle-progress{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .6s ease;}
.circle-pct{font-size:24px;font-weight:600;margin-top:-28px;position:relative;z-index:1;}
.circle-label{font-size:12px;color:#5d6b78;margin-top:4px;text-align:center;max-width:140px;}
.followup{border-left:3px solid #2c6e6a;padding-left:16px;margin-top:20px;}
.followup h3{margin:0 0 12px;font-size:15px;color:#2c6e6a;}
.q-block{margin-bottom:14px;}
.q-block strong{display:block;margin-bottom:6px;font-size:13px;}
.q-block textarea{width:100%;height:60px;font-size:13px;}
.top{font-size:20px;font-weight:600;margin:0 0 4px;}
.confidence{color:#5d6b78;font-size:13px;margin:0 0 16px;}
.err{color:#8a3f3f;border-left:3px solid #8a3f3f;padding-left:12px;}
footer{margin-top:40px;padding-top:18px;border-top:1px solid #d3d9dd;font-size:12px;color:#5d6b78;}
</style>
</head>
<body>
<div class="c">
<h1>Mental Health Classifier</h1>
<p class="meta">CSE440 — BRAC University</p>
<label>How have you been feeling?</label>
<textarea id="text" placeholder="Describe your mood, sleep, energy, any concerns..." maxlength="3000"></textarea>
<div class="ctrl">
<select id="model">
<option value="lr">Logistic Regression</option>
<option value="bert">BERT</option>
</select>
<button id="go">Analyse</button>
<span class="cnt"><span id="chars">0</span> / 3000</span>
</div>
<div id="result"></div>
<footer><strong>Course project.</strong> Not a diagnostic tool. Nothing logged.</footer>
</div>

<script>
const COLORS={Anxiety:"#c08a2e",Bipolar:"#7b6bb0",Depression:"#34627f",Normal:"#4c8b64","Personality disorder":"#a25f78",Stress:"#b5713f",Suicidal:"#8a3f3f"};
const QUESTIONS=["How long have you been feeling this way?","How is your sleep?","How is your appetite?","Are you enjoying things you normally enjoy?","Have you talked to anyone about this?"];
const RAILWAY="https://YOUR-RAILWAY-URL.up.railway.app";

const $=id=>document.getElementById(id);

$("text").addEventListener("input",()=>{$("chars").textContent=$("text").value.length;});

function circleProgress(label,prob,color){
  const radius=45;const circumference=2*Math.PI*radius;const offset=circumference*(1-prob);const pct=Math.round(prob*100);
  return `<div class="circle-wrap"><svg class="circle-svg" viewBox="0 0 120 120"><circle class="circle-bg" cx="60" cy="60" r="${radius}"></circle><circle class="circle-progress" cx="60" cy="60" r="${radius}" stroke="${color}" style="stroke-dasharray:${circumference};stroke-dashoffset:${offset}"></circle></svg><div class="circle-pct" style="color:${color}">${pct}%</div><div class="circle-label">${label}</div></div>`;
}

function renderCircles(dist){
  return `<div class="circles">${dist.slice(0,7).map(d=>circleProgress(d.label,d.probability,COLORS[d.label]||"#8894a0")).join("")}</div>`;
}

function renderFollowup(originalText){
  const qs=QUESTIONS.map((q,i)=>`<div class="q-block"><strong>→ ${q}</strong><textarea class="q-${i}" placeholder="Answer here..."></textarea></div>`).join("");
  return `<div class="followup"><h3>Need more clarity</h3><p style="font-size:13px;color:#5d6b78;margin-bottom:14px;">Your answer wasn't clear enough. Answer a few quick questions and we'll re-analyze:</p>${qs}<button id="reanalyze" style="background:#2c6e6a;color:#fff;border:none;padding:10px 16px;border-radius:3px;cursor:pointer;margin-top:12px;">Re-analyse with more context</button></div>`;
}

async function analyse(text,model){
  const ep=model==="bert"?`${RAILWAY}/predict/bert?text=${encodeURIComponent(text)}`:`${RAILWAY}/predict/lr?text=${encodeURIComponent(text)}`;
  const r=await fetch(ep,{method:"POST"});
  const d=await r.json();
  if(d.error)throw new Error(d.error);
  return d;
}

$("go").addEventListener("click",async()=>{
  const text=$("text").value.trim();
  if(!text){$("text").focus();return;}
  const model=$("model").value;
  $("go").disabled=true;
  $("go").textContent="Analysing…";
  try{
    const data=await analyse(text,model);
    const top=data.top;
    const dist=data.distribution.sort((a,b)=>b.probability-a.probability);
    
    if(data.confidence_low){
      $("result").innerHTML=`<div class="panel"><p class="confidence">Confidence: ${(top.probability*100).toFixed(0)}% — need more detail</p>${renderCircles(dist)}${renderFollowup(text)}</div>`;
      document.getElementById("reanalyze").addEventListener("click",async()=>{
        const answers=QUESTIONS.map((_,i)=>document.querySelector(`.q-${i}`).value).filter(v=>v.trim());
        if(!answers.length){alert("Please answer at least one question");return;}
        const combined=text+" "+answers.join(" ");
        $("result").innerHTML="<div class=panel><p style=color:#5d6b78>Re-analysing…</p></div>";
        try{
          const data2=await analyse(combined,model);
          const top2=data2.top;const dist2=data2.distribution.sort((a,b)=>b.probability-a.probability);
          $("result").innerHTML=`<div class="panel"><p class="top">${top2.label}</p><p class="confidence">Confidence: ${(top2.probability*100).toFixed(0)}%</p>${renderCircles(dist2)}</div>`;
        }catch(e){$("result").innerHTML=`<div class="panel err">Re-analysis failed: ${e.message}</div>`;}
      });
    }else{
      $("result").innerHTML=`<div class="panel"><p class="top">${top.label}</p><p class="confidence">Confidence: ${(top.probability*100).toFixed(0)}%</p>${renderCircles(dist)}</div>`;
    }
  }catch(e){
    $("result").innerHTML=`<div class="panel err">${e.message}</div>`;
  }finally{
    $("go").disabled=false;
    $("go").textContent="Analyse";
  }
});
</script>
</body>
</html>
